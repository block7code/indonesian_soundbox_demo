<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indonesian Soundbox Demo</title>
    <meta name="description" content="Video demo Indonesian Soundbox Flutter package.">

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: auto;
        }

        video {
            width: 100%;
            border-radius: 12px;
            background: #000;
        }

        a {
            color: #2563eb;
        }

        .demo-video {
            width: 100%;
            max-width: 320px;
            margin: 24px auto;
        }

        .demo-video video {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 16px;
            background: #000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>

<body>
    <main>
        <h1>Indonesian Soundbox</h1>
        <p>Demo video for the Flutter package</p>


        <div class="demo-video">
            <video controls playsinline preload="metadata">
                <source src="./demo/demo_indonesian_soundbox.mp4" type="video/mp4">
                Browser kamu tidak mendukung video.
            </video>
        </div>


        <p>
            <a href="./demo/demo_indonesian_soundbox.mp4" download>
                Download Demo Video
            </a>
        </p>
    </main>
</body>

</html>
